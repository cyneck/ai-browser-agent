[tool.poetry]
name = "ai-browser-agent"
version = "0.1.0"
description = "AI浏览器代理系统，通过自然语言指令控制浏览器"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"
packages = [
  { include = "action", from = "src" },
  { include = "api", from = "src" },
  { include = "common", from = "src" },
  { include = "perception", from = "src" },
  { include = "plugins", from = "src" },
  { include = "reasoning", from = "src" },
]

[tool.poetry.dependencies]
python = "^3.10"
playwright = "^1.40.0"
fastapi = "^0.104.0"
uvicorn = "^0.23.2"
jinja2 = "^3.1.2"
pydantic = "^2.4.2"
python-dotenv = "^1.0.0"
loguru = "^0.7.2"
google-generativeai = "^0.5.4"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-asyncio = "^0.21.1"
black = "^23.10.0"
isort = "^5.12.0"
mypy = "^1.6.1"
flake8 = "^6.1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py39']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
asyncio_mode = "auto"