<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <!-- 背景 -->
  <rect width="800" height="600" fill="#f8f9fa" />
  
  <!-- 标题 -->
  <text x="400" y="40" font-family="Arial" font-size="24" text-anchor="middle" font-weight="bold">AI 浏览器代理系统架构</text>
  
  <!-- 感知层 -->
  <rect x="100" y="100" width="600" height="100" rx="10" ry="10" fill="#e6f7ff" stroke="#1890ff" stroke-width="2" />
  <text x="400" y="130" font-family="Arial" font-size="18" text-anchor="middle" font-weight="bold">感知层 (Perception Layer)</text>
  
  <!-- 感知层组件 -->
  <rect x="150" y="150" width="120" height="40" rx="5" ry="5" fill="#ffffff" stroke="#1890ff" stroke-width="1" />
  <text x="210" y="175" font-family="Arial" font-size="12" text-anchor="middle">网页解析器</text>
  
  <rect x="340" y="150" width="120" height="40" rx="5" ry="5" fill="#ffffff" stroke="#1890ff" stroke-width="1" />
  <text x="400" y="175" font-family="Arial" font-size="12" text-anchor="middle">意图提取器</text>
  
  <rect x="530" y="150" width="120" height="40" rx="5" ry="5" fill="#ffffff" stroke="#1890ff" stroke-width="1" />
  <text x="590" y="175" font-family="Arial" font-size="12" text-anchor="middle">页面监控器</text>
  
  <!-- 推理层 -->
  <rect x="100" y="250" width="600" height="100" rx="10" ry="10" fill="#f6ffed" stroke="#52c41a" stroke-width="2" />
  <text x="400" y="280" font-family="Arial" font-size="18" text-anchor="middle" font-weight="bold">推理层 (Reasoning Layer)</text>
  
  <!-- 推理层组件 -->
  <rect x="150" y="300" width="120" height="40" rx="5" ry="5" fill="#ffffff" stroke="#52c41a" stroke-width="1" />
  <text x="210" y="325" font-family="Arial" font-size="12" text-anchor="middle">对话管理器</text>
  
  <rect x="340" y="300" width="120" height="40" rx="5" ry="5" fill="#ffffff" stroke="#52c41a" stroke-width="1" />
  <text x="400" y="325" font-family="Arial" font-size="12" text-anchor="middle">任务规划器</text>
  
  <rect x="530" y="300" width="120" height="40" rx="5" ry="5" fill="#ffffff" stroke="#52c41a" stroke-width="1" />
  <text x="590" y="325" font-family="Arial" font-size="12" text-anchor="middle">指令生成器</text>
  
  <!-- 执行层 -->
  <rect x="100" y="400" width="600" height="100" rx="10" ry="10" fill="#fff2e8" stroke="#fa8c16" stroke-width="2" />
  <text x="400" y="430" font-family="Arial" font-size="18" text-anchor="middle" font-weight="bold">执行层 (Action Layer)</text>
  
  <!-- 执行层组件 -->
  <rect x="120" y="450" width="120" height="40" rx="5" ry="5" fill="#ffffff" stroke="#fa8c16" stroke-width="1" />
  <text x="180" y="475" font-family="Arial" font-size="12" text-anchor="middle">指令模板库</text>
  
  <rect x="260" y="450" width="120" height="40" rx="5" ry="5" fill="#ffffff" stroke="#fa8c16" stroke-width="1" />
  <text x="320" y="475" font-family="Arial" font-size="12" text-anchor="middle">动作执行器</text>
  
  <rect x="400" y="450" width="120" height="40" rx="5" ry="5" fill="#ffffff" stroke="#fa8c16" stroke-width="1" />
  <text x="460" y="475" font-family="Arial" font-size="12" text-anchor="middle">状态管理器</text>
  
  <rect x="540" y="450" width="120" height="40" rx="5" ry="5" fill="#ffffff" stroke="#fa8c16" stroke-width="1" />
  <text x="600" y="475" font-family="Arial" font-size="12" text-anchor="middle">错误处理器</text>
  
  <!-- 数据流箭头 -->
  <!-- 感知层 -> 推理层 -->
  <path d="M400 200 L400 250" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="420" y="225" font-family="Arial" font-size="10">页面意图图谱</text>
  
  <!-- 推理层 -> 执行层 -->
  <path d="M400 350 L400 400" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="420" y="375" font-family="Arial" font-size="10">JSON指令</text>
  
  <!-- 执行层 -> 感知层 -->
  <path d="M100 450 C50 450, 50 150, 100 150" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="30" y="300" font-family="Arial" font-size="10">页面更新</text>
  
  <!-- 外部系统 -->
  <rect x="100" y="550" width="200" height="40" rx="5" ry="5" fill="#f9f0ff" stroke="#722ed1" stroke-width="2" />
  <text x="200" y="575" font-family="Arial" font-size="14" text-anchor="middle">用户界面</text>
  
  <rect x="500" y="550" width="200" height="40" rx="5" ry="5" fill="#f9f0ff" stroke="#722ed1" stroke-width="2" />
  <text x="600" y="575" font-family="Arial" font-size="14" text-anchor="middle">浏览器 (Playwright)</text>
  
  <!-- 外部系统连接 -->
  <path d="M200 550 L200 500" stroke="#722ed1" stroke-width="2" marker-end="url(#arrowhead)" />
  <path d="M600 550 L600 500" stroke="#722ed1" stroke-width="2" marker-end="url(#arrowhead)" />
  
  <!-- 箭头标记定义 -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000000" />
    </marker>
  </defs>
  
  <!-- 图例 -->
  <rect x="650" y="10" width="15" height="15" fill="#e6f7ff" stroke="#1890ff" stroke-width="1" />
  <text x="670" y="22" font-family="Arial" font-size="10">感知层</text>
  
  <rect x="650" y="30" width="15" height="15" fill="#f6ffed" stroke="#52c41a" stroke-width="1" />
  <text x="670" y="42" font-family="Arial" font-size="10">推理层</text>
  
  <rect x="650" y="50" width="15" height="15" fill="#fff2e8" stroke="#fa8c16" stroke-width="1" />
  <text x="670" y="62" font-family="Arial" font-size="10">执行层</text>
  
  <rect x="650" y="70" width="15" height="15" fill="#f9f0ff" stroke="#722ed1" stroke-width="1" />
  <text x="670" y="82" font-family="Arial" font-size="10">外部系统</text>
</svg>