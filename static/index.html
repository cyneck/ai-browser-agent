<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>AI 浏览器代理 - 测试控制台</title>
	<style>
		:root {
			--bg: #0f172a;
			--panel: #111827;
			--muted: #94a3b8;
			--text: #e5e7eb;
			--accent: #22c55e;
			--danger: #ef4444;
		}
		* { box-sizing: border-box; }
		html, body { height: 100%; }
		body {
			margin: 0;
			background: linear-gradient(180deg, #0b1222, #0f172a);
			color: var(--text);
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "WenQuanYi Micro Hei", sans-serif;
		}
		.container {
			max-width: 960px;
			margin: 0 auto;
			padding: 24px 16px 120px;
		}
		h1 {
			font-size: 20px;
			font-weight: 600;
			margin: 0 0 16px;
		}
		.toolbar {
			display: flex;
			gap: 8px;
			align-items: center;
			margin-bottom: 12px;
		}
		.toolbar input[type="text"] {
			flex: 1 1 auto;
			background: #0b1020;
			border: 1px solid #1f2937;
			padding: 10px 12px;
			border-radius: 8px;
			color: var(--text);
			outline: none;
		}
		.toolbar input[type="text"]:focus { border-color: #374151; }
		.toolbar .btn {
			background: #111827;
			border: 1px solid #1f2937;
			color: var(--text);
			padding: 10px 12px;
			border-radius: 8px;
			cursor: pointer;
		}
		.toolbar .btn:hover { border-color: #374151; }
		.panel {
			background: rgba(17, 24, 39, 0.6);
			border: 1px solid rgba(31, 41, 55, 0.8);
			backdrop-filter: blur(6px);
			border-radius: 12px;
			padding: 12px;
		}
		.messages {
			height: 60vh;
			overflow: auto;
			display: flex;
			flex-direction: column;
			gap: 12px;
			padding: 8px;
		}
		.msg { display: flex; gap: 12px; }
		.msg .bubble {
			max-width: 80%;
			padding: 10px 12px;
			border-radius: 12px;
			font-size: 14px;
			line-height: 1.5;
		}
		.msg.user { justify-content: flex-end; }
		.msg.user .bubble {
			background: #1f2937;
			border: 1px solid #374151;
		}
		.msg.bot .bubble {
			background: #0b1020;
			border: 1px solid #1f2937;
		}
		.msg.error .bubble {
			background: rgba(239, 68, 68, 0.08);
			border: 1px solid rgba(239, 68, 68, 0.35);
			color: #fecaca;
		}
		.screenshot {
			margin-top: 8px;
			border-radius: 10px;
			border: 1px solid #1f2937;
			max-width: 100%;
		}
		.inputbar {
			position: fixed;
			left: 0;
			right: 0;
			bottom: 0;
			background: linear-gradient(180deg, rgba(2,6,23,0), rgba(2,6,23,0.85) 30%, rgba(2,6,23,0.95));
			padding: 16px 12px 18px;
		}
		.inputbar .inner {
			max-width: 960px;
			margin: 0 auto;
			background: rgba(17, 24, 39, 0.7);
			border: 1px solid rgba(31, 41, 55, 0.8);
			backdrop-filter: blur(6px);
			border-radius: 12px;
			padding: 10px;
			display: flex;
			gap: 8px;
			align-items: center;
		}
		.inputbar input[type="text"] {
			flex: 1 1 auto;
			background: #0b1020;
			border: 1px solid #1f2937;
			padding: 12px 12px;
			border-radius: 8px;
			color: var(--text);
			outline: none;
		}
		.inputbar .send {
			background: linear-gradient(180deg, #22c55e, #16a34a);
			border: none;
			color: #062a10;
			font-weight: 600;
			padding: 12px 16px;
			border-radius: 8px;
			cursor: pointer;
		}
		.small { color: var(--muted); font-size: 12px; }
		.kv { display: flex; gap: 8px; align-items: center; }
		.kv label { color: var(--muted); font-size: 12px; }
	</style>
</head>
<body>
	<div class="container">
		<h1>AI 浏览器代理 · 测试控制台</h1>
		<div class="toolbar">
			<div class="kv">
				<label>会话 ID</label>
				<input id="sessionId" type="text" placeholder="默认：自动生成" />
			</div>
			<button id="newSessionBtn" class="btn">新建会话</button>
			<button id="closeSessionBtn" class="btn">关闭会话</button>
		</div>
		<div class="panel">
			<div id="messages" class="messages" aria-live="polite"></div>
		</div>
	</div>

	<div class="inputbar">
		<div class="inner">
			<input id="input" type="text" placeholder="输入自然语言指令，例如：打开 https://example.com 并搜索 AI" />
			<button id="send" class="send">发送</button>
		</div>
		<div class="inner" style="margin-top:8px; padding:8px 10px;">
			<span class="small">提示：服务启动后，直接在此输入指令即可调用后端接口 /api/execute。</span>
		</div>
	</div>

	<script>
		(function () {
			const $ = (id) => document.getElementById(id);
			const messagesEl = $("messages");
			const inputEl = $("input");
			const sendBtn = $("send");
			const sessionEl = $("sessionId");
			const newSessionBtn = $("newSessionBtn");
			const closeSessionBtn = $("closeSessionBtn");

			function uuid() {
				return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
					const r = Math.random() * 16 | 0, v = c === 'x' ? r : (r & 0x3 | 0x8);
					return v.toString(16);
				});
			}

			function currentSessionId() {
				return sessionEl.value.trim() || sessionEl.placeholder || uuid();
			}

			function ensureSessionId() {
				if (!sessionEl.value.trim()) {
					sessionEl.value = uuid();
				}
				return sessionEl.value;
			}

			function scrollToBottom() {
				messagesEl.scrollTop = messagesEl.scrollHeight;
			}

			function addMessage(role, text, opts = {}) {
				const div = document.createElement('div');
				div.className = 'msg ' + role + (opts.error ? ' error' : '');
				const bubble = document.createElement('div');
				bubble.className = 'bubble';
				bubble.textContent = text;
				div.appendChild(bubble);
				if (opts.screenshot) {
					const img = document.createElement('img');
					img.className = 'screenshot';
					img.src = 'data:image/png;base64,' + opts.screenshot;
					img.alt = 'screenshot';
					div.appendChild(img);
				}
				messagesEl.appendChild(div);
				scrollToBottom();
			}

			async function sendInstruction() {
				const text = inputEl.value.trim();
				if (!text) return;
				const sid = ensureSessionId();
				addMessage('user', text);
				inputEl.value = '';
				const thinkingId = uuid();
				addMessage('bot', '执行中...', { id: thinkingId });

				try {
					const res = await fetch('/api/execute', {
						method: 'POST',
						headers: { 'Content-Type': 'application/json' },
						body: JSON.stringify({ text, session_id: sid })
					});
					if (!res.ok) throw new Error('HTTP ' + res.status);
					const data = await res.json();
					addMessage('bot', data.message || (data.success ? '执行成功' : '执行失败'), {
						screenshot: data.screenshot
					});
					if (!data.success && data.error) {
						addMessage('bot', '错误: ' + data.error, { error: true });
					}
				} catch (e) {
					addMessage('bot', '请求失败: ' + (e && e.message ? e.message : e), { error: true });
				}
			}

			async function closeSession() {
				const sid = currentSessionId();
				if (!sid) return;
				try {
					const res = await fetch('/api/sessions/' + encodeURIComponent(sid), { method: 'DELETE' });
					if (!res.ok) throw new Error('HTTP ' + res.status);
					const data = await res.json();
					addMessage('bot', data.message || '会话已关闭');
				} catch (e) {
					addMessage('bot', '关闭会话失败: ' + (e && e.message ? e.message : e), { error: true });
				}
			}

			newSessionBtn.addEventListener('click', () => {
				sessionEl.value = uuid();
				addMessage('bot', '已创建新会话: ' + sessionEl.value);
			});
			closeSessionBtn.addEventListener('click', closeSession);
			sendBtn.addEventListener('click', sendInstruction);
			inputEl.addEventListener('keydown', (e) => {
				if (e.key === 'Enter' && !e.shiftKey) {
					e.preventDefault();
					sendInstruction();
				}
			});

			// 初始欢迎
			addMessage('bot', '欢迎使用 AI 浏览器代理！请输入自然语言指令开始测试。');
		})();
	</script>
</body>
</html>
